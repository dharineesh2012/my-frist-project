{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <form action="{{ url_for('add_task') }}" method="post" class="input-group">
      <input type="text" name="title" class="form-control" placeholder="What needs to be done?" maxlength="200" required autofocus>
      <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg"></i> Add</button>
    </form>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <ul class="nav nav-pills">
    <li class="nav-item">
      <a class="nav-link {{ 'active' if filter_by == 'all' }}" href="{{ url_for('index', filter='all') }}">All</a>
    </li>
    <li class="nav-item">
      <a class="nav-link {{ 'active' if filter_by == 'active' }}" href="{{ url_for('index', filter='active') }}">Active</a>
    </li>
    <li class="nav-item">
      <a class="nav-link {{ 'active' if filter_by == 'completed' }}" href="{{ url_for('index', filter='completed') }}">Completed</a>
    </li>
  </ul>
  <span class="text-muted small">{{ counts.done }} of {{ counts.total }} done</span>
</div>

<div class="card shadow-sm">
  <ul class="list-group list-group-flush">
    {% for task in tasks %}
    <li class="list-group-item d-flex align-items-center gap-2">
      <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="post" class="m-0">
        <button type="submit" class="btn btn-link p-0 fs-4 {{ 'text-success' if task.completed else 'text-secondary' }}" title="Toggle complete">
          <i class="bi {{ 'bi-check-circle-fill' if task.completed else 'bi-circle' }}"></i>
        </button>
      </form>

      <span class="flex-grow-1 {{ 'text-decoration-line-through text-muted' if task.completed }}">
        {{ task.title }}
      </span>

      <a href="{{ url_for('edit_task', task_id=task.id) }}" class="btn btn-sm btn-outline-secondary" title="Edit">
        <i class="bi bi-pencil"></i>
      </a>

      <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post" class="m-0"
            onsubmit="return confirm('Delete this task?');">
        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
          <i class="bi bi-trash"></i>
        </button>
      </form>
    </li>
    {% else %}
    <li class="list-group-item text-center text-muted py-4">
      No tasks here. Add one above!
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
